name: Unpack sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old files with the OmniTill bundle
        run: |
          git rm -q --ignore-unmatch index.html login.html stok.html seed.html firebase-init.js deai.js deai.css README.md LICENSE
          unzip -q -o OmniTill-repo.zip -x '.github/*'
          git rm -q -f OmniTill-repo.zip
          git add -A
          git update-index --chmod=+x android/gradlew
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -q -m "Unpack OmniTill sources" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01RsnDc6QEhM7WStqyAwJJvC"
          git push
